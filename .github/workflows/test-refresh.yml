name: Manual TEST refresh

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j4b-refresh-test
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_MODE: test
      ALLOW_PRODUCTION_WRITE: "false"
      PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL }}
      PORTAL_LOGIN: ${{ secrets.PORTAL_LOGIN }}
      PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.TEST_GOOGLE_SPREADSHEET_ID }}
      GOOGLE_WORKSHEET: projects_current
      PORTAL_REQUEST_DELAY: "0.15"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Public repository safety check
        run: python scripts/public_repo_safety_check.py

      - name: Unit and portability tests
        run: python -m pytest -q

      - name: Validate required runtime secrets
        shell: bash
        run: |
          python - <<'PY'
          import os
          required = [
              "PORTAL_BASE_URL",
              "PORTAL_LOGIN",
              "PORTAL_PASSWORD",
              "GOOGLE_CLIENT_ID",
              "GOOGLE_CLIENT_SECRET",
              "GOOGLE_REFRESH_TOKEN",
              "GOOGLE_SPREADSHEET_ID",
          ]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing required GitHub Actions secrets: " + ", ".join(missing))
          print("RUNTIME_SECRET_CONTRACT=PASS")
          PY

      - name: Run isolated TEST refresh
        run: python -m src.refresh
