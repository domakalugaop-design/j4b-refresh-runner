name: Manual production refresh

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j4b-refresh-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUN_MODE: production
      ALLOW_PRODUCTION_WRITE: "true"
      PRODUCTION_CONFIRMATION: J4B_PRODUCTION
      PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL }}
      PORTAL_LOGIN: ${{ secrets.PORTAL_LOGIN }}
      PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.PRODUCTION_GOOGLE_SPREADSHEET_ID }}
      GOOGLE_WORKSHEET: projects_current
      PORTAL_REQUEST_DELAY: "0.15"
      J4B_PERSISTENT_BACKUP_DIR: ${{ github.workspace }}/.j4b-prepublication-backup
      J4B_PERSISTENT_BACKUP_UPLOAD_MARKER: ${{ github.workspace }}/.j4b-prepublication-backup/upload.ok

    steps:
      - name: Checkout production cutover branch
        uses: actions/checkout@v7
        with:
          ref: production-cutover

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Public repository safety check
        run: python scripts/public_repo_safety_check.py

      - name: Unit and portability tests
        run: python -m pytest -q

      - name: Validate required runtime secrets
        shell: bash
        run: |
          python - <<'PY'
          import os
          required = [
              "PORTAL_BASE_URL",
              "PORTAL_LOGIN",
              "PORTAL_PASSWORD",
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "GOOGLE_SPREADSHEET_ID",
          ]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing required GitHub Actions secrets: " + ", ".join(missing))
          if os.environ.get("RUN_MODE") != "production":
              raise SystemExit("RUN_MODE gate failed")
          if os.environ.get("ALLOW_PRODUCTION_WRITE") != "true":
              raise SystemExit("ALLOW_PRODUCTION_WRITE gate failed")
          if os.environ.get("PRODUCTION_CONFIRMATION") != "J4B_PRODUCTION":
              raise SystemExit("PRODUCTION_CONFIRMATION gate failed")
          print("PRODUCTION_RUNTIME_GATE=PASS")
          PY

      - name: Acquire regular selected scope and save private checkpoint
        env:
          ENABLE_WORKFLOW_ANALYTICS_PUBLICATION: "true"
          ACQUISITION_ONLY: "true"
          ACQUISITION_CHECKPOINT_PATH: /tmp/j4b-acquisition-checkpoint.json
        run: python -m src.production

      - name: Materialization preflight (no publication)
        env:
          ENABLE_WORKFLOW_ANALYTICS_PUBLICATION: "true"
          REPLAY_ACQUISITION_CHECKPOINT: "true"
          MATERIALIZATION_PREFLIGHT: "true"
          ACQUISITION_CHECKPOINT_PATH: /tmp/j4b-acquisition-checkpoint.json
        run: python -m src.production

      - name: Create persistent pre-publication backup
        env:
          ENABLE_WORKFLOW_ANALYTICS_PUBLICATION: "true"
          PAYMENT_REFRESH_ENABLED: "true"
          PREPUBLICATION_BACKUP_ONLY: "true"
        run: |
          rm -rf "$J4B_PERSISTENT_BACKUP_DIR"
          mkdir -p "$J4B_PERSISTENT_BACKUP_DIR"
          chmod 700 "$J4B_PERSISTENT_BACKUP_DIR"
          python -m src.production
          test "$(find "$J4B_PERSISTENT_BACKUP_DIR" -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 1
          chmod 600 "$J4B_PERSISTENT_BACKUP_DIR"/*.json

      - name: Verify backup integrity before artifact upload
        env:
          ENABLE_WORKFLOW_ANALYTICS_PUBLICATION: "true"
          PAYMENT_REFRESH_ENABLED: "true"
          PREPUBLICATION_BACKUP_ONLY: "true"
        run: |
          python - <<'PY'
          import glob, hashlib, json, os, stat
          files = glob.glob(os.path.join(os.environ["J4B_PERSISTENT_BACKUP_DIR"], "*.json"))
          if len(files) != 1:
              raise SystemExit("persistent backup file count check failed")
          path = files[0]
          if stat.S_IMODE(os.stat(path).st_mode) != 0o600:
              raise SystemExit("persistent backup permissions check failed")
          with open(path, "rb") as handle:
              payload = json.load(handle)
          if payload.get("version") != 1 or not payload.get("sheets"):
              raise SystemExit("persistent backup structure check failed")
          print("PERSISTENT_PREPUBLICATION_BACKUP_SHA256=" + hashlib.sha256(open(path, "rb").read()).hexdigest())
          print("PERSISTENT_PREPUBLICATION_BACKUP_INTEGRITY=PASS")
          PY

      - name: Upload private pre-publication backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: j4b-prepublication-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.j4b-prepublication-backup/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Confirm persistent backup artifact upload
        run: |
          printf 'PASS\n' > "$J4B_PERSISTENT_BACKUP_UPLOAD_MARKER"
          chmod 600 "$J4B_PERSISTENT_BACKUP_UPLOAD_MARKER"
          test "$(cat "$J4B_PERSISTENT_BACKUP_UPLOAD_MARKER")" = PASS
          echo PERSISTENT_PREPUBLICATION_BACKUP_ARTIFACT_UPLOAD=PASS

      - name: Run production refresh from checkpoint
        env:
          ENABLE_WORKFLOW_ANALYTICS_PUBLICATION: "true"
          PAYMENT_REFRESH_ENABLED: "true"
          REPLAY_ACQUISITION_CHECKPOINT: "true"
          ACQUISITION_CHECKPOINT_PATH: /tmp/j4b-acquisition-checkpoint.json
        run: python -m src.production
