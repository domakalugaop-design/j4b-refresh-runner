name: Public repository safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  safety-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run public repository safety check
        run: python3 scripts/public_repo_safety_check.py
