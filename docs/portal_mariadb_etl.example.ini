# Redacted template only. Copy outside the repository, set owner-only permissions,
# and populate only from approved secret/host-key sources. This is not executable.
#
# Server mode (Analytics VPS): PostgreSQL is reached directly through the private
# Docker network and the storage guard runs locally:
#   [target] transport = direct      (host stays "postgres"; resolved via local
#                                     docker inspect against the internal network)
#   [guard]  transport = local
# The reference ETL additionally supports server-side portal credentials:
#   [portal] login_file = ... / password_file = ...   (0600, outside Git)

[source]
transport = tls
host = lk.j4b.ru
port = 3306
database = j4b
user = APPROVED_READ_ONLY_ACCOUNT_FROM_SECURE_CONFIG
password_file = /secure/external/path/mariadb-readonly-password
verify_identity = true
# Optional CA file. If omitted, the OS trust store is used with hostname checking.
ca_file = /secure/external/path/mariadb-ca.pem

# For an approved SSH route, replace transport=tls with transport=ssh-tunnel and
# provide ssh_host (the MariaDB host itself), ssh_user, known_hosts_file, and
# ssh_host_fingerprints copied from an independently confirmed source. If using
# a jump host, also provide ssh_jump_host and ssh_jump_fingerprints. Never use
# ssh-keyscan output as trusted input without independent fingerprint confirmation.
#
# Optional on any transport: ssh_identity_file points to a dedicated 0600 SSH
# private key; the ETL then connects with -i <file> -o IdentitiesOnly=yes.
#
# Owner-approved legacy exception (2026-10-28): transport=legacy-plain reads the
# allowlisted dataset over plaintext MariaDB. It requires BOTH the config opt-in
# legacy_plain_opt_in=true restricted to the approved read-only account AND the
# CLI flag --allow-legacy-plain. The connection additionally verifies that the
# server used mysql_native_password challenge-response, so the reusable secret
# is never transmitted in clear form. Dataset values themselves travel
# unencrypted by explicit owner decision.
# [source]
# transport = legacy-plain
# legacy_plain_opt_in = true
# user = watch

[target]
transport = ssh-tunnel
host = postgres
port = 5432
database = j4b_analytics
user = j4b_analytics_loader
password_file = /secure/external/path/analytics-loader-password
ssh_host = /approved-vps-ssh-alias
ssh_port = 22
ssh_user = /approved-vps-ssh-user
known_hosts_file = /secure/external/path/approved-known-hosts
ssh_host_fingerprints = SHA256:REPLACE_WITH_INDEPENDENTLY_CONFIRMED_VALUE
# Optional jump-host fields: ssh_jump_host, ssh_jump_user, ssh_jump_fingerprints.

[guard]
compose_project_dir = /home/service/app/j4b-analytics
compose_file = j4b-analytics-compose.yaml
